### Per-user skill graph with strengths/weaknesses (jsonb).
class: SkillProfile
table: skill_profile
fields:
  authUser: module:serverpod_auth_core:AuthUser?, relation(onDelete=Cascade)
  skillGraph: Map<String, SkillNode>, serializationDataType=jsonb
  weaknesses: List<Weakness>, serializationDataType=jsonb
  strengths: List<String>, serializationDataType=jsonb
  averageScores: InterviewScores?, serializationDataType=jsonb
  sessionsCompleted: int, default=0
  updatedAt: DateTime, default=now
indexes:
  skill_profile_auth_user_uidx:
    fields: authUserId
    unique: true
  skill_profile_graph_gin_idx:
    fields: skillGraph
    type: gin
    operatorClass: jsonbPathOps
