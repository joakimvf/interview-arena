# Template for config/passwords.yaml, which is gitignored. Copy it there and
# fill in your own values; never commit real keys.
# For the random secrets, any long random string works, e.g. the output of
# `openssl rand -base64 24`.

development:
  database: '<random string>'
  serviceSecret: '<random string>'
  emailSecretHashPepper: '<random string>'
  jwtHmacSha512PrivateKey: '<random string>'
  jwtRefreshTokenHashPepper: '<random string>'

  # Required for questions, scoring, feedback and resume parsing.
  anthropicApiKey: '<your Anthropic API key>'

  # Optional: the interviewer's voice. The key needs the Text to Speech
  # permission; without elevenLabsVoiceId it also needs Voices > Read.
  elevenLabsApiKey: '<your ElevenLabs API key>'
  elevenLabsVoiceId: '<ElevenLabs voice id>'

  # Optional: career-memory embeddings (Voyage AI, 1024 dimensions).
  # voyageApiKey: '<your Voyage AI key>'

test:
  database: '<random string>'
  emailSecretHashPepper: '<random string>'
  jwtHmacSha512PrivateKey: '<random string>'
  jwtRefreshTokenHashPepper: '<random string>'

# Deployed servers (Serverpod Cloud) don't read this file. Set the same keys
# with `serverpod cloud password set <name> --from-file <file>`, plus:
#   adminEmail, adminPassword  Sign-up is closed outside development and test,
#   juryEmail, juryPassword    so the server creates these accounts at start
#                              (and resets their passwords on every start).
#                              Share the jury one only via the submission.
