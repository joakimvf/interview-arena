name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.4'
      # Throwaway values for the CI-only test database and auth (not real
      # secrets; config/passwords.yaml is gitignored, so CI supplies them here).
      SERVERPOD_PASSWORD_database: '9KkbdGL3QNrMUrguiEsjYsXOFnm6Ujw'
      SERVERPOD_PASSWORD_emailSecretHashPepper: 'nITsHTZr9n1r8xsMLRaa3LMOQWtiwJM'
      SERVERPOD_PASSWORD_jwtHmacSha512PrivateKey: 'lDQ2jJrQE8pz7czMsCRGKCPdtgXKE4B'
      SERVERPOD_PASSWORD_jwtRefreshTokenHashPepper: 'nIlNHzrTwyES1q4fFBHu1AzGn4J49FQ'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      # The test config sets `database.dataPath`, so the tests run against an
      # embedded PostgreSQL that Serverpod starts itself. No Docker needed.
      # The binaries are downloaded once and cached here between runs. The
      # bundle changes with the Serverpod version, so the version is in the key.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: serverpod-pg-binaries-${{runner.os}}-${{env.VERSION}}

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: |
          dart install serverpod_cli@$VERSION
          # `dart install` puts executables in the Dart data home, which is not
          # on the PATH of a GitHub runner.
          echo "${XDG_STATE_HOME:-$HOME/.local/state}/Dart/install/bin" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: interview_arena_server
        run: serverpod generate

      - name: Run tests
        working-directory: interview_arena_server
        run: dart test
